<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>67교 공식 웹사이트</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #f59e0b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; padding: 1.5rem 1rem; }
    
    header { text-align: center; margin-bottom: 20px; }
    .symbol { font-size: 4.5rem; font-weight: 900; color: var(--accent-color); text-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }

    nav { display: flex; gap: 8px; margin-bottom: 20px; background: var(--card-bg); padding: 6px; border-radius: 8px; border: 1px solid #334155; }
    nav button { background: none; border: none; color: var(--text-color); font-size: 15px; padding: 8px 16px; cursor: pointer; border-radius: 6px; transition: 0.2s; }
    nav button.active { background: var(--accent-color); color: #000; font-weight: bold; }

    .tab-content { display: none; max-width: 500px; width: 100%; }
    .tab-content.active { display: block; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid #334155; margin-bottom: 15px; text-align: center; }
    .count-box { font-size: 2.8rem; color: var(--accent-color); font-weight: bold; margin: 15px 0; }
    
    .btn { display: inline-block; width: 100%; padding: 14px; background: var(--accent-color); color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.2s; }
    .btn:hover { background: #d97706; }
    .btn:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; }
  </style>
</head>
<body>

  <header>
    <div class="symbol">67</div>
    <h1>67교</h1>
    <p style="color: var(--text-muted);">위대한 숫자 67을 좋아하면 누구나 신자</p>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchTab('home')">홈</button>
    <button class="nav-btn" onclick="switchTab('doctrine')">믿는 법</button>
    <button class="nav-btn" onclick="switchTab('join')">입교 신청</button>
  </nav>

  <!-- 탭 1: 홈 -->
  <div id="tab-home" class="tab-content active">
    <div class="card">
      <h2>전 세계 67교 신자 수</h2>
      <div class="count-box" id="believer-count">동기화 중...</div>
      <p style="font-size: 0.85rem; color: var(--text-muted);">* Koyeb 파이썬 서버 & IndexedDB 실시간 동기화</p>
    </div>
  </div>

  <!-- 탭 2: 믿는 법 -->
  <div id="tab-doctrine" class="tab-content">
    <div class="card" style="text-align: left;">
      <h2 style="color: var(--accent-color); margin-bottom: 12px;">67교를 믿는 유일한 교리</h2>
      <p style="margin-bottom: 15px; font-size: 1.1rem;"><strong>"그냥 67을 좋아하기만 하면 됩니다."</strong></p>
      <ul style="padding-left: 20px; line-height: 1.8; color: #cbd5e1;">
        <li>복잡한 경전이나 교리가 전혀 없습니다.</li>
        <li>헌금이나 강요도 존재하지 않습니다.</li>
        <li>일상에서 67이라는 숫자를 보면 소소하게 기뻐하세요.</li>
      </ul>
    </div>
  </div>

  <!-- 탭 3: 입교 신청 -->
  <div id="tab-join" class="tab-content">
    <div class="card">
      <h2>1인 1회 입교 서약</h2>
      <p style="margin: 10px 0; color: var(--text-muted); font-size: 0.9rem;">
        브라우저 고유 ID와 IP 주소가 기록되며,<br>1인당 단 1회만 카운트됩니다.
      </p>
      <button id="join-btn" class="btn" onclick="handleJoin()">67을 좋아합니다 (입교하기)</button>
      <p id="status-msg" style="margin-top: 15px; font-weight: bold; font-size: 0.95rem;"></p>
    </div>
  </div>

  <script>
    const SERVER_URL = ''; // Koyeb에서 같은 도메인으로 제공되므로 상대 경로 사용

    let db;
    let userId = null;

    // 1. IndexedDB 초기화
    function initIndexedDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('Church67DB', 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('userStore')) {
            db.createObjectStore('userStore', { keyPath: 'key' });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = () => reject('IndexedDB 열기 실패');
      });
    }

    function getIDBData(key) {
      return new Promise((resolve) => {
        const tx = db.transaction('userStore', 'readonly');
        const store = tx.objectStore('userStore');
        const req = store.get(key);
        req.onsuccess = () => resolve(req.result ? req.result.value : null);
        req.onerror = () => resolve(null);
      });
    }

    function setIDBData(key, value) {
      return new Promise((resolve) => {
        const tx = db.transaction('userStore', 'readwrite');
        const store = tx.objectStore('userStore');
        store.put({ key: key, value: value });
        tx.oncomplete = () => resolve();
      });
    }

    async function setupUser() {
      let savedId = await getIDBData('userId');
      if (!savedId) {
        savedId = 'user_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
        await setIDBData('userId', savedId);
      }
      userId = savedId;

      const hasJoined = await getIDBData('hasJoined');
      if (hasJoined) {
        disableJoinButton("이미 입교한 신도입니다.");
      }
    }

    async function fetchStats() {
      try {
        const res = await fetch(`${SERVER_URL}/api/stats`);
        const data = await res.json();
        if (data.success) {
          document.getElementById('believer-count').innerText = `${data.believerCount} 명`;
          await setIDBData('cachedCount', data.believerCount);
        }
      } catch (err) {
        const cachedCount = await getIDBData('cachedCount');
        if (cachedCount) {
          document.getElementById('believer-count').innerText = `${cachedCount} 명 (오프라인)`;
        }
      }
    }

    async function handleJoin() {
      const statusMsg = document.getElementById('status-msg');
      statusMsg.innerText = "처리 중...";

      try {
        const res = await fetch(`${SERVER_URL}/api/join`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: userId })
        });

        const data = await res.json();

        if (data.success) {
          statusMsg.style.color = '#10b981';
          statusMsg.innerText = data.message;
          document.getElementById('believer-count').innerText = `${data.believerCount} 명`;
          
          await setIDBData('hasJoined', true);
          await setIDBData('cachedCount', data.believerCount);
          disableJoinButton("입교 완료!");
        } else {
          statusMsg.style.color = '#ef4444';
          statusMsg.innerText = data.message;
          if (res.status === 400) {
            await setIDBData('hasJoined', true);
            disableJoinButton("이미 입교된 상태입니다.");
          }
        }
      } catch (err) {
        statusMsg.style.color = '#ef4444';
        statusMsg.innerText = "서버 연결 오류가 발생했습니다.";
      }
    }

    function disableJoinButton(text) {
      const btn = document.getElementById('join-btn');
      btn.disabled = true;
      btn.innerText = text;
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      event.target.classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await initIndexedDB();
      await setupUser();
      await fetchStats();
      setInterval(fetchStats, 3000);
    });
  </script>
</body>
</html>
